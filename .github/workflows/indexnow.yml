name: IndexNow submit

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
  workflow_dispatch:
    inputs:
      full:
        description: 'Submit every URL in sitemap.xml instead of only changed files'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve IndexNow key
        id: key
        env:
          SECRET_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          KEY="$SECRET_KEY"
          if [ -z "$KEY" ]; then
            # Fall back to the public key file committed at the repo root.
            F="$(ls -1 [0-9a-f][0-9a-f]*.txt 2>/dev/null | head -1 || true)"
            if [ -n "$F" ]; then
              KEY="$(tr -d '[:space:]' < "$F")"
              echo "Using key from repo key file (secret INDEXNOW_KEY not set)."
            fi
          fi
          if [ -z "$KEY" ]; then
            echo "::error::No IndexNow key available."
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Collect URLs
        id: urls
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            grep -oE '<loc>[^<]+</loc>' sitemap.xml | sed -E 's#</?loc>##g' > urls.txt
          else
            # Underscore-prefixed paths are repo-only and never deployed
            # (_partials/ is excluded by .vercelignore). They are source files,
            # not URLs, so they must never reach IndexNow.
            git diff --name-only --diff-filter=ACM \
              "${{ github.event.before }}" "${{ github.sha }}" -- '*.html' \
              | grep -v '^_' > changed.txt || true
            : > urls.txt
            while read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                index.html) echo "https://skyviewfg.com/" >> urls.txt ;;
                thank-you.html) ;;                       # noindex, never submit
                *) echo "https://skyviewfg.com/$f" >> urls.txt ;;
              esac
            done < changed.txt
          fi

          # Backstop for the whole class of bug: this job maps changed FILES to
          # URLs, so any file that is not actually served becomes a bad
          # submission. Filtering one prefix fixes one instance; verifying that
          # each candidate is live fixes the class. Retries once because the
          # Vercel production deploy for this same commit may still be building.
          #
          # NOTE: IndexNow deliberately accepts 404/410 as a removal signal.
          # Dropping non-200 URLs is safe here only because the diff filter
          # above is ACM, so deletions never reach this list. If D is ever
          # added, this check has to learn the difference.
          : > live.txt
          while read -r u; do
            [ -z "$u" ] && continue
            for attempt in 1 2; do
              CODE="$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 10 "$u" || echo 000)"
              if [ "$CODE" = "200" ]; then break; fi
              if [ "$attempt" -lt 2 ]; then sleep 10; fi
            done
            if [ "$CODE" = "200" ]; then
              echo "$u" >> live.txt
            else
              echo "SKIP $u (HTTP $CODE) - not live, not submitted."
            fi
          done < urls.txt
          mv live.txt urls.txt

          COUNT="$(wc -l < urls.txt | tr -d ' ')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Collected $COUNT live URL(s)."
          cat urls.txt

      - name: Submit to IndexNow
        if: steps.urls.outputs.count != '0'
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          PAYLOAD="$(jq -R -s -c --arg host skyviewfg.com --arg key "$KEY" \
            --arg loc "https://skyviewfg.com/${KEY}.txt" \
            '{host:$host, key:$key, keyLocation:$loc,
              urlList: (split("\n") | map(select(length>0)))}' < urls.txt)"
          STATUS="$(curl -sS -o body.txt -w '%{http_code}' -X POST \
            https://api.indexnow.org/IndexNow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-raw "$PAYLOAD")"
          echo "HTTP $STATUS"
          cat body.txt || true
          # 200 = accepted+validated, 202 = accepted, validation pending.
          case "$STATUS" in 200|202) ;; *) exit 1 ;; esac

      - name: Nothing to submit
        if: steps.urls.outputs.count == '0'
        run: echo "No changed .html files in this push - exiting clean."
